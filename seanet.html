<title>CelesteOS — SeaNet Co</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: #0C0B0A;
    font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
    color: #FFFFFF;
  }
  .wrap {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 4rem 2rem;
  }
  .card { width: 100%; max-width: 400px; text-align: center; }
  .logo { height: 56px; width: auto; max-width: 180px; object-fit: contain; margin-bottom: 1.4rem; }
  .wordmark {
    font-family: 'Eloquia Display', 'DM Sans', system-ui, sans-serif;
    font-size: clamp(2.2rem, 4.5vw, 2.8rem); font-weight: 300;
    letter-spacing: -0.005em; line-height: 1; color: #FFFFFF;
  }
  .wordmark span { font-weight: 600; color: #5AABCC; }
  .divider { width: 44px; height: 1px; background: rgba(255,255,255,0.14); margin: 1.8rem auto; }
  .sub {
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 1.05rem; font-weight: 300; color: rgba(255,255,255,0.92);
  }
  .gate-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase;
    color: rgba(255,255,255,0.55); margin-top: 2.4rem; margin-bottom: 0.9rem;
  }
  input {
    width: 100%; box-sizing: border-box;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.14); border-radius: 2px;
    padding: 0.8rem 1rem; color: #FFFFFF; font-size: 0.92rem;
    font-family: 'DM Sans', system-ui, sans-serif; text-align: center;
    letter-spacing: 0.02em; outline: none;
  }
  input:focus { border-color: rgba(90,171,204,0.5); }
  #gate-error {
    display: none; color: #C0503A; font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem; letter-spacing: 0.04em; margin-top: 0.75rem;
  }
  button {
    margin-top: 1.2rem; width: 100%; appearance: none;
    background: #5AABCC; border: none; border-radius: 2px;
    padding: 0.75rem 1.2rem; color: #FFFFFF; font-weight: 600;
    font-family: 'Eloquia Display', 'DM Sans', system-ui, sans-serif;
    font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase;
    cursor: pointer;
  }
  button:hover { background: #6dbadb; }
  .docs { display: none; flex-direction: column; gap: 0.85rem; text-align: left; margin-top: 2.4rem; }
  .doc-link {
    display: block; text-decoration: none; color: inherit;
    border: 1px solid rgba(255,255,255,0.14); border-radius: 2px;
    padding: 1.25rem 1.4rem; transition: border-color 0.15s, background 0.15s;
  }
  .doc-link:hover { border-color: rgba(90,171,204,0.45); background: rgba(255,255,255,0.02); }
  .doc-title {
    font-family: 'Eloquia Display', 'DM Sans', system-ui, sans-serif;
    font-size: 1.02rem; font-weight: 500; color: rgba(255,255,255,0.92); margin-bottom: 0.35rem;
  }
  .doc-desc { font-size: 0.82rem; color: rgba(255,255,255,0.55); line-height: 1.45; }
  .doc-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.66rem; letter-spacing: 0.08em; text-transform: uppercase;
    color: #5AABCC; margin-top: 0.7rem;
  }
</style>

<script>
(function(){
  var KEY = 'seanet_access_granted';
  var CODE = 'seanetco';
  var gate = document.getElementById('gate');
  var docs = document.getElementById('docs');
  function unlock(){
    gate.style.display = 'none';
    docs.style.display = 'flex';
  }
  if (localStorage.getItem(KEY) === '1') { unlock(); }
  var input = document.getElementById('gate-input');
  var err = document.getElementById('gate-error');
  var btn = document.getElementById('gate-submit');
  function tryUnlock(){
    if (input.value.trim().toLowerCase() === CODE) {
      localStorage.setItem(KEY, '1');
      unlock();
    } else {
      err.style.display = 'block';
      input.value = '';
      input.focus();
    }
  }
  btn.addEventListener('click', tryUnlock);
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter') tryUnlock(); });
  setTimeout(function(){ input.focus(); }, 50);
})();
</script>
