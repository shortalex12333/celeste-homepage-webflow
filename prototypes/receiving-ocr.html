<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editorial · Receiving OCR · short-shipment</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; }

:root {
  --bg: linear-gradient(160deg, #181614 0%, #14110F 50%, #0C0B0A 100%);
  --bg-glow: radial-gradient(circle at 25% 20%, rgba(90,171,204,0.04), transparent 55%);
  --card-bg: rgba(30, 27, 24, 0.85);
  --card-border: rgba(255,255,255,0.06);
  --card-border-top: rgba(255,255,255,0.10);
  --card-shadow: 0 1px 0 rgba(0,0,0,0.40), 0 8px 24px rgba(0,0,0,0.30);
  --card-radius: 8px;
  --row-border: rgba(255,255,255,0.04);
  --txt: rgba(255,255,255,0.92);
  --txt-dim: rgba(255,255,255,0.55);
  --txt-ghost: rgba(255,255,255,0.35);
  --mono-dim: rgba(255,255,255,0.40);
  --green: #4A9468;
  --green-bg: rgba(74,148,104,0.12);
  --green-txt: #6BB885;
  --red: #C0503A;
  --red-bg: rgba(192,80,58,0.14);
  --red-txt: #E07060;
  --teal: #5AABCC;
}
[data-theme="light"] {
  --bg: linear-gradient(160deg, #FEFEFE 0%, #FAF8F5 25%, #F2EDE7 65%, #EBE5DE 100%);
  --bg-glow: none;
  --card-bg: #FFFFFF;
  --card-border: rgba(0,0,0,0.05);
  --card-border-top: rgba(0,0,0,0.05);
  --card-shadow: 0 1px 2px rgba(0,0,0,0.03), 0 8px 24px rgba(0,0,0,0.05), 0 24px 64px rgba(0,0,0,0.04);
  --card-radius: 10px;
  --row-border: rgba(0,0,0,0.025);
  --txt: #1a1a1a;
  --txt-dim: #777;
  --txt-ghost: #999;
  --mono-dim: #aaa;
  --green: #3A7A55;
  --green-bg: rgba(74,148,104,0.10);
  --green-txt: #3A7A55;
  --red: #B83A28;
  --red-bg: rgba(184,58,40,0.08);
  --red-txt: #B83A28;
  --teal: #2B7BA3;
}

body {
  background: var(--bg);
  font-family: 'DM Sans', -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  display: flex; align-items: stretch; justify-content: stretch;
  padding: 16px; width: 520px; height: 320px;
  overflow: hidden; position: relative;
}
body::before {
  content: ''; position: absolute; inset: 0;
  background: var(--bg-glow); pointer-events: none;
}

.card {
  width: 100%; flex: 1;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-top-color: var(--card-border-top);
  border-radius: var(--card-radius);
  box-shadow: var(--card-shadow);
  overflow: hidden; display: flex; flex-direction: column;
  position: relative; z-index: 1;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}

.c-head {
  padding: 12px 18px;
  border-bottom: 1px solid var(--row-border);
  display: flex; align-items: center; gap: 10px;
}
.c-id {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px; color: var(--txt-dim); letter-spacing: 0.04em;
}
.c-flag {
  margin-left: auto;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.08em;
  padding: 3px 9px; border-radius: 3px;
  background: var(--red-bg);
  color: var(--red-txt);
}

table.ocr {
  width: 100%; border-collapse: collapse;
}
table.ocr th {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px; font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--mono-dim);
  padding: 10px 16px 8px;
  text-align: left;
  border-bottom: 1px solid var(--row-border);
}
table.ocr td {
  font-size: 12px; color: var(--txt);
  padding: 10px 16px;
  border-bottom: 1px solid var(--row-border);
}
table.ocr td.mono {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px; color: var(--txt-dim);
}
table.ocr tr.bad td {
  color: var(--red-txt); font-weight: 500;
}
.pill {
  display: inline-flex; align-items: center;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px; font-weight: 600;
  letter-spacing: 0.04em; text-transform: uppercase;
  padding: 2px 7px; border-radius: 3px;
}
.pill.ok { background: var(--green-bg); color: var(--green-txt); }
.pill.bad { background: var(--red-bg); color: var(--red-txt); }

.foot {
  margin-top: auto;
  padding: 11px 18px;
  border-top: 1px solid var(--row-border);
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
}
.foot-amt {
  font-size: 11px; color: var(--txt-dim);
}
.foot-amt .mono {
  font-family: 'IBM Plex Mono', monospace;
  font-weight: 500; color: var(--red-txt); margin-right: 4px;
}
.foot-btn {
  font-family: 'DM Sans', sans-serif;
  font-size: 11px; font-weight: 500;
  color: #fff; background: var(--teal);
  padding: 6px 11px; border-radius: 4px;
}
</style>
</head>
<body>
<div class="card">
  <div class="c-head">
    <div class="c-id">RCV-1102 · OCR'd 09:21</div>
    <div class="c-flag">Discrepancy</div>
  </div>
  <table class="ocr">
    <thead>
      <tr><th>Item</th><th>PO</th><th>DN</th><th>Δ</th></tr>
    </thead>
    <tbody>
      <tr>
        <td>Membrane</td>
        <td class="mono">4</td>
        <td class="mono">4</td>
        <td><span class="pill ok">OK</span></td>
      </tr>
      <tr>
        <td>O-ring kit</td>
        <td class="mono">6</td>
        <td class="mono">6</td>
        <td><span class="pill ok">OK</span></td>
      </tr>
      <tr class="bad">
        <td>Salinity probe</td>
        <td class="mono">12</td>
        <td class="mono">10</td>
        <td><span class="pill bad">−2</span></td>
      </tr>
    </tbody>
  </table>
  <div class="foot">
    <div class="foot-amt"><span class="mono">£4,200</span>short-shipped · PO-2026-0034</div>
    <span class="foot-btn">Reject + open claim</span>
  </div>
</div>
</body>
</html>
