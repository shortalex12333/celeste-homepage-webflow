<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editorial · Handover · Daily Prompt</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; }

:root {
  --bg: linear-gradient(160deg, #181614 0%, #14110F 50%, #0C0B0A 100%);
  --bg-glow: radial-gradient(circle at 25% 20%, rgba(90,171,204,0.04), transparent 55%);
  --card-bg: rgba(30, 27, 24, 0.85);
  --card-border: rgba(255,255,255,0.06);
  --card-border-top: rgba(255,255,255,0.10);
  --card-shadow: 0 1px 0 rgba(0,0,0,0.40), 0 8px 24px rgba(0,0,0,0.30);
  --card-radius: 8px;
  --row-border: rgba(255,255,255,0.04);
  --txt: rgba(255,255,255,0.92);
  --txt-dim: rgba(255,255,255,0.55);
  --txt-ghost: rgba(255,255,255,0.35);
  --mono-dim: rgba(255,255,255,0.40);
  --teal: #5AABCC;
  --teal-bg: rgba(90,171,204,0.12);
  --teal-border: rgba(90,171,204,0.32);
}
[data-theme="light"] {
  --bg: linear-gradient(160deg, #FEFEFE 0%, #FAF8F5 25%, #F2EDE7 65%, #EBE5DE 100%);
  --bg-glow: none;
  --card-bg: #FFFFFF;
  --card-border: rgba(0,0,0,0.05);
  --card-border-top: rgba(0,0,0,0.05);
  --card-shadow: 0 1px 2px rgba(0,0,0,0.03), 0 8px 24px rgba(0,0,0,0.05), 0 24px 64px rgba(0,0,0,0.04);
  --card-radius: 10px;
  --row-border: rgba(0,0,0,0.025);
  --txt: #1a1a1a;
  --txt-dim: #777;
  --txt-ghost: #999;
  --mono-dim: #aaa;
  --teal: #2B7BA3;
  --teal-bg: rgba(43,123,163,0.08);
  --teal-border: rgba(43,123,163,0.20);
}

body {
  background: var(--bg);
  font-family: 'DM Sans', -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  display: flex; align-items: stretch; justify-content: stretch;
  padding: 16px; width: 460px; height: 280px;
  overflow: hidden; position: relative;
}
body::before {
  content: ''; position: absolute; inset: 0;
  background: var(--bg-glow); pointer-events: none;
}

.card {
  width: 100%; flex: 1;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-top-color: var(--card-border-top);
  border-radius: var(--card-radius);
  box-shadow: var(--card-shadow);
  overflow: hidden; display: flex; flex-direction: column;
  position: relative; z-index: 1;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}

/* Background context — faded record the user just closed */
.bg-row {
  padding: 14px 20px;
  border-bottom: 1px solid var(--row-border);
  font-size: 12px; color: var(--txt-dim);
  opacity: 0.55;
}
.bg-row .mono { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--mono-dim); margin-right: 8px; }
.bg-row.mid { opacity: 0.40; }
.bg-row.low { opacity: 0.28; border-bottom: none; }

/* The daily-prompt overlay */
.prompt {
  margin-top: auto;
  background: var(--card-bg);
  border-top: 1px solid var(--teal-border);
  padding: 14px 20px;
  display: flex; align-items: center; gap: 12px;
}
.prompt-icon {
  width: 28px; height: 28px;
  border-radius: 6px;
  background: var(--teal-bg);
  color: var(--teal);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.prompt-body { flex: 1; min-width: 0; }
.prompt-title {
  font-size: 13px; font-weight: 500; color: var(--txt);
  margin-bottom: 2px;
}
.prompt-sub {
  font-size: 11px; color: var(--txt-dim);
  font-family: 'IBM Plex Mono', monospace;
}
.prompt-actions { display: flex; gap: 6px; flex-shrink: 0; }
.btn {
  font-family: 'DM Sans', sans-serif;
  font-size: 12px; font-weight: 500;
  padding: 7px 12px; border-radius: 4px;
  border: 1px solid transparent; cursor: default; white-space: nowrap;
}
.btn-ghost {
  background: transparent; color: var(--txt-dim);
  border-color: var(--card-border);
}
.btn-primary {
  background: var(--teal); color: #fff;
}
</style>
</head>
<body>
<div class="card">
  <div class="bg-row"><span class="mono">FLT-1843</span>Starboard chiller short-cycling</div>
  <div class="bg-row mid">Resolved · Expansion valve replaced · 14:32</div>
  <div class="bg-row low">Closed by C/E Williams · linked to WO-0142, P-00412</div>
  <div class="prompt">
    <div class="prompt-icon">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 4h16v12H5.17L4 17.17V4z"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="12" x2="13" y2="12"/>
      </svg>
    </div>
    <div class="prompt-body">
      <div class="prompt-title">Add to handover draft?</div>
      <div class="prompt-sub">FLT-1843 · Starboard chiller short-cycling</div>
    </div>
    <div class="prompt-actions">
      <span class="btn btn-ghost">Dismiss</span>
      <span class="btn btn-primary">Yes</span>
    </div>
  </div>
</div>
</body>
</html>
