<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editorial · Handover · Sign-off (both sides)</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; }

:root {
  --bg: linear-gradient(160deg, #181614 0%, #14110F 50%, #0C0B0A 100%);
  --bg-glow: radial-gradient(circle at 25% 20%, rgba(90,171,204,0.04), transparent 55%);
  --card-bg: rgba(30, 27, 24, 0.85);
  --card-border: rgba(255,255,255,0.06);
  --card-border-top: rgba(255,255,255,0.10);
  --card-shadow: 0 1px 0 rgba(0,0,0,0.40), 0 8px 24px rgba(0,0,0,0.30);
  --card-radius: 8px;
  --row-border: rgba(255,255,255,0.04);
  --txt: rgba(255,255,255,0.92);
  --txt-dim: rgba(255,255,255,0.55);
  --txt-ghost: rgba(255,255,255,0.35);
  --mono-dim: rgba(255,255,255,0.40);
  --green: #4A9468;
  --green-bg: rgba(74,148,104,0.12);
  --green-border: rgba(74,148,104,0.32);
  --green-txt: #6BB885;
  --teal: #5AABCC;
  --teal-bg: rgba(90,171,204,0.14);
}
[data-theme="light"] {
  --bg: linear-gradient(160deg, #FEFEFE 0%, #FAF8F5 25%, #F2EDE7 65%, #EBE5DE 100%);
  --bg-glow: none;
  --card-bg: #FFFFFF;
  --card-border: rgba(0,0,0,0.05);
  --card-border-top: rgba(0,0,0,0.05);
  --card-shadow: 0 1px 2px rgba(0,0,0,0.03), 0 8px 24px rgba(0,0,0,0.05), 0 24px 64px rgba(0,0,0,0.04);
  --card-radius: 10px;
  --row-border: rgba(0,0,0,0.025);
  --txt: #1a1a1a;
  --txt-dim: #777;
  --txt-ghost: #999;
  --mono-dim: #aaa;
  --green: #3A7A55;
  --green-bg: rgba(74,148,104,0.10);
  --green-border: transparent;
  --green-txt: #3A7A55;
  --teal: #2B7BA3;
  --teal-bg: rgba(43,123,163,0.10);
}

body {
  background: var(--bg);
  font-family: 'DM Sans', -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  display: flex; align-items: stretch; justify-content: stretch;
  padding: 16px; width: 520px; height: 320px;
  overflow: hidden; position: relative;
}
body::before {
  content: ''; position: absolute; inset: 0;
  background: var(--bg-glow); pointer-events: none;
}

.card {
  width: 100%; flex: 1;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-top-color: var(--card-border-top);
  border-radius: var(--card-radius);
  box-shadow: var(--card-shadow);
  overflow: hidden; display: flex; flex-direction: column;
  position: relative; z-index: 1;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}

.c-head {
  padding: 14px 20px;
  border-bottom: 1px solid var(--row-border);
  display: flex; align-items: center; gap: 10px;
}
.c-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
.c-title { font-size: 13px; font-weight: 500; color: var(--txt); }
.c-mono {
  margin-left: auto;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px; color: var(--mono-dim); letter-spacing: 0.04em;
}

.sig-row {
  padding: 12px 20px;
  border-bottom: 1px solid var(--row-border);
  display: flex; align-items: center; gap: 12px;
}
.sig-row:last-child { border-bottom: none; }

.sig-avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--teal-bg);
  color: var(--teal);
  display: flex; align-items: center; justify-content: center;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px; font-weight: 600;
  flex-shrink: 0;
}
.sig-info { flex: 1; min-width: 0; }
.sig-name { font-size: 12px; font-weight: 500; color: var(--txt); line-height: 1.2; }
.sig-role { font-size: 10.5px; color: var(--txt-dim); margin-top: 2px; }
.sig-ts {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px; color: var(--txt-ghost);
  white-space: nowrap;
}
.sig-state {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px; font-weight: 600;
  letter-spacing: 0.06em; text-transform: uppercase;
  padding: 4px 9px; border-radius: 3px;
  background: var(--green-bg);
  color: var(--green-txt);
  border: 1px solid var(--green-border);
}
.sig-state.notified {
  background: transparent;
  color: var(--txt-dim);
  border-color: var(--row-border);
}
.sig-state svg { color: currentColor; }
</style>
</head>
<body>
<div class="card">
  <div class="c-head">
    <div class="c-dot"></div>
    <div class="c-title">Handover · Engineering · Sign-off</div>
    <div class="c-mono">HO-2025-1142</div>
  </div>

  <div class="sig-row">
    <div class="sig-avatar">JW</div>
    <div class="sig-info">
      <div class="sig-name">James Williams</div>
      <div class="sig-role">Outgoing Chief Engineer</div>
    </div>
    <div class="sig-ts">28 Nov · 14:42</div>
    <div class="sig-state">
      <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
      Signed
    </div>
  </div>

  <div class="sig-row">
    <div class="sig-avatar">MD</div>
    <div class="sig-info">
      <div class="sig-name">Mark Davies</div>
      <div class="sig-role">Incoming · critical acknowledgement</div>
    </div>
    <div class="sig-ts">28 Nov · 16:11</div>
    <div class="sig-state">
      <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
      Acknowledged
    </div>
  </div>

  <div class="sig-row">
    <div class="sig-avatar">SH</div>
    <div class="sig-info">
      <div class="sig-name">Capt. S. Hawthorne</div>
      <div class="sig-role">Notified · M/Y Whisper</div>
    </div>
    <div class="sig-ts">28 Nov · 16:11</div>
    <div class="sig-state notified">Notified</div>
  </div>
</div>
</body>
</html>
